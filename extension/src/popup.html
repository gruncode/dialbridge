<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DialBridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>DialBridge</h1>

    <label for="pairing">Pairing code</label>
    <textarea id="pairing" rows="3" placeholder="paste the code from the phone app" autocomplete="off"></textarea>
    <p class="hint">
      The phone app shows this once. It carries the delivery address and the
      encryption key, so treat it like a password.
    </p>

    <p id="paired" class="paired"></p>

    <label for="countryCode">Country code</label>
    <input id="countryCode" type="text" inputmode="numeric" placeholder="30" />
    <p class="hint">Digits only. Used for numbers written without a leading +.</p>

    <label class="checkbox">
      <input id="markPlainText" type="checkbox" />
      Underline phone numbers written as plain text
    </label>

    <label class="checkbox">
      <input id="enabled" type="checkbox" />
      Enabled
    </label>

    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="test" type="button" class="secondary">Send a test</button>
    </div>

    <div class="row">
      <button id="forget" type="button" class="danger">Forget this phone</button>
    </div>

    <p id="status" role="status"></p>

    <script src="phone.js"></script>
    <script src="crypto.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
